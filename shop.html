<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Performance Office Chairs</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        function addToCart(productName, productPrice) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const item = {
                name: productName,
                price: productPrice,
                quantity: 1
            };
            
            const existingItem = cart.find(p => p.name === productName);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push(item);
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            alert(productName + ' added to cart!');
        }
    </script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="products">
            <h2>Our Products</h2>
            <div class="product">
                <!-- Placeholder for Product 1 -->
                <img src="product1.png" alt="Product 1" style="max-width: 300px;">
                <h3>Extreme Posture Device 1000</h3>
                <p>Unleash your corporate potential</p>
                <p>Price: $120</p>
                <button class="add-to-cart" onclick="addToCart('Extreme Posture Device 1000', '$120')">Add to Cart</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Performance Office Chairs. All rights reserved.</p>
    </footer>
</body>
</html>
