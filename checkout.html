<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Performance Office Chairs</title>
    <link rel="stylesheet" href="styles.css">
    <script src="cart.js" defer></script>
</head>
<body>
    <header>
        <div class="nav-wrap">
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
            <div class="logo-center">
                <img src="logochair.png" alt="Performance Office Chairs Logo" class="header-logo">
            </div>
            <div class="cart-widget">
                <button class="cart-button" aria-label="View cart" onclick="toggleCartDropdown()">
                    <span class="cart-icon">🛒</span>
                    <span id="cart-count">0</span>
                </button>
                <div id="cart-status" class="cart-status" aria-live="polite">Cart is empty</div>
                <div id="cart-dropdown" class="cart-dropdown">
                    <div id="cart-items" class="cart-items">
                        <!-- Cart items will be populated here -->
                    </div>
                    <button id="checkout-button" class="checkout-button" onclick="goToCheckout()">Go to Checkout</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section id="checkout">
            <h2>Checkout</h2>
            <div class="checkout-container">
                <div class="cart-summary">
                    <h3>Your Cart</h3>
                    <div id="checkout-cart-items">
                        <!-- Cart items will be displayed here -->
                    </div>
                    <div id="cart-total" class="cart-total"></div>
                </div>
                <div class="order-form">
                    <h3>Order Information</h3>
                    <form id="order-form">
                        <label for="name">Full Name:</label>
                        <input type="text" id="name" name="name" required>

                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>

                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" required>

                        <label for="address">Shipping Address:</label>
                        <input type="text" id="address" name="address" placeholder="Street Address" required>
                        <input type="text" id="city" name="city" placeholder="City" required>
                        <input type="text" id="state" name="state" placeholder="State" required>
                        <input type="text" id="zip" name="zip" placeholder="ZIP Code" required>

                        <label for="payment">Payment Method:</label>
                        <select id="payment" name="payment" required>
                            <option value="">Select Payment Method</option>
                            <option value="credit">Credit Card</option>
                            <option value="paypal">PayPal</option>
                            <option value="bank">Bank Transfer</option>
                        </select>

                        <button type="submit" class="submit-order">Place Order</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Performance Office Chairs. All rights reserved.</p>
    </footer>
    <script src="checkout.js"></script>
</body>
</html>
